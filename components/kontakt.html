<h2 style="margin:0 0 18px">Kontakt a rezervace</h2>
<div class="contact">
  <div>
    <p class="muted">
      Máte otázky nebo chcete rezervovat termín? Napište nám nebo zavolejte — odpovíme co nejdříve.
    </p>
    <p style="margin-top:18px"><strong>Adresa:</strong><br>Ulice 123, Město</p>
    <p><strong>Telefon:</strong><br>+420 123 456 789</p>
  </div>

  <aside class="card">
    <form action="#" method="post">
      <input type="text" name="name" placeholder="Jméno" required>
      <input type="email" name="email" placeholder="Email" required>
      <input type="text" name="phone" placeholder="Telefon (volitelné)">
      <textarea name="message" rows="4" placeholder="Zpráva / požadavky"></textarea>
      <button class="send">Odeslat zprávu</button>
    </form>
  </aside>
</div>
